[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vouch-audit"
version = "0.1.0"
description = "Agentic auditing of npm packages with attestations keyed by exact bytes."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "pydantic>=2.8.0",
  "typer>=0.12.0",
  "uvicorn>=0.30.0",
  "rich>=13.7.0",
  "python-multipart>=0.0.9"
]

[project.scripts]
vouch = "vouch_agent.cli:app"

[tool.setuptools.packages.find]
where = ["agent"]

[tool.pytest.ini_options]
testpaths = ["agent/tests"]
pythonpath = ["agent"]

