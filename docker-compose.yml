services:
  api:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - .:/app
    command: sh -c "pip install -e . && uvicorn api.main:app --host 0.0.0.0 --port 8787"
    ports:
      - "8787:8787"
  web:
    image: node:24-slim
    working_dir: /app/web
    volumes:
      - .:/app
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0 --port 3000"
    ports:
      - "3000:3000"

